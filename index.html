<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelly Yang | Cosmic Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #03030c;
            --accent-glow: rgba(0, 243, 255, 0.6);
            --primary-font: 'Plus Jakarta Sans', sans-serif;
            --title-font: 'Orbitron', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            color: #ffffff;
            font-family: var(--primary-font);
        }

        /* 宇宙 Canvas 背景 */
        #space-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        /* 容器主视图 */
        .galaxy-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 中央星核 Kelly Yang */
        .core-star {
            position: absolute;
            z-index: 10;
            text-align: center;
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .core-star-glow {
            width: 120px;
            height: 120px;
            margin: 0 auto;
            border-radius: 50%;
            background: radial-gradient(circle, #ffffff 0%, rgba(255, 230, 180, 0.8) 35%, rgba(0, 243, 255, 0.4) 60%, transparent 100%);
            box-shadow: 0 0 50px rgba(255, 255, 255, 0.8), 0 0 100px rgba(0, 243, 255, 0.5);
            animation: pulse-core 4s infinite alternate ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .core-star-text {
            margin-top: 15px;
            font-family: var(--title-font);
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
            background: linear-gradient(135deg, #ffffff, #8ee0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .core-subtitle {
            font-size: 0.75rem;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 4px;
        }

        .core-star:hover {
            transform: scale(1.12);
        }

        .core-star:hover .core-star-glow {
            box-shadow: 0 0 80px rgba(255, 255, 255, 1), 0 0 140px rgba(0, 243, 255, 0.9);
        }

        /* 螺旋轨道节点 (行星) */
        .planet-node {
            position: absolute;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.4s ease, filter 0.4s ease;
            transform-origin: center center;
        }

        .planet-sphere {
            border-radius: 50%;
            position: relative;
            transition: all 0.4s ease;
            box-shadow: inset -5px -5px 15px rgba(0,0,0,0.8);
        }

        .planet-node:hover {
            z-index: 20;
            transform: scale(1.25) translateY(-5px) !important;
        }

        .planet-label {
            margin-top: 10px;
            font-family: var(--title-font);
            font-size: 0.8rem;
            letter-spacing: 1.5px;
            white-space: nowrap;
            color: rgba(255, 255, 255, 0.85);
            background: rgba(3, 3, 12, 0.7);
            padding: 4px 10px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
            pointer-events: none;
        }

        .planet-node:hover .planet-label {
            color: #ffffff;
            border-color: var(--planet-color);
            box-shadow: 0 0 15px var(--planet-color);
        }

        /* 详情模态窗口 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(3, 3, 12, 0.85);
            backdrop-filter: blur(20px);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            width: 85%;
            max-width: 1000px;
            height: 80vh;
            background: rgba(12, 12, 28, 0.75);
            border-radius: 24px;
            border: 1px solid var(--theme-color, rgba(255, 255, 255, 0.2));
            box-shadow: 0 0 60px var(--theme-glow, rgba(0, 0, 0, 0.8));
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transform: scale(0.9);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.active .modal-card {
            transform: scale(1);
        }

        .modal-header {
            padding: 25px 35px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-family: var(--title-font);
            font-size: 1.8rem;
            color: var(--theme-color, #fff);
            text-shadow: 0 0 20px var(--theme-color);
        }

        .close-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: all 0.3s ease;
        }

        .close-btn:hover {
            background: rgba(255, 0, 85, 0.6);
            border-color: #ff0055;
            transform: rotate(90deg);
        }

        .modal-body {
            padding: 35px;
            overflow-y: auto;
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        /* 项目展示卡片 */
        .project-card {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .project-card:hover {
            transform: translateY(-8px);
            border-color: var(--theme-color);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5), 0 0 15px var(--theme-glow);
        }

        .project-thumb {
            width: 100%;
            height: 180px;
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .project-info {
            padding: 20px;
        }

        .project-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: #ffffff;
        }

        .project-desc {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
            line-height: 1.5;
        }

        /* About Me 专属视图 */
        .about-content {
            grid-column: 1 / -1;
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 700px;
            margin: 0 auto;
            line-height: 1.8;
            color: rgba(255, 255, 255, 0.85);
            font-size: 1.05rem;
        }

        .about-highlight {
            color: var(--theme-color, #00f3ff);
            font-weight: 600;
        }

        /* 顶部音频控制提示 */
        .audio-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 50;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.75rem;
            letter-spacing: 1px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .audio-toggle:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        @keyframes pulse-core {
            0% { transform: scale(0.95); opacity: 0.85; }
            100% { transform: scale(1.05); opacity: 1; }
        }

        @media (max-width: 768px) {
            .planet-label { font-size: 0.7rem; padding: 2px 6px; }
            .core-star-text { font-size: 1rem; }
            .core-star-glow { width: 80px; height: 80px; }
        }
    </style>
</head>
<body>

    <canvas id="space-canvas"></canvas>

    <button class="audio-toggle" id="sound-btn">🔊 AUDIO: ON</button>

    <div class="galaxy-container" id="galaxy">
        <!-- 中央星核 (About Me) -->
        <div class="core-star" onclick="openAboutModal()">
            <div class="core-star-glow">
                <div style="width: 20px; height: 20px; background: #fff; border-radius: 50%; box-shadow: 0 0 20px #fff;"></div>
            </div>
            <div class="core-star-text">Kelly Yang</div>
            <div class="core-subtitle">INTERACTIVE CREATOR</div>
        </div>

        <!-- 8大行星分类由 JavaScript 动态生成并计算螺旋位置 -->
    </div>

    <!-- 作品/个人介绍 弹出层 -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-card" id="modal-card">
            <div class="modal-header">
                <div class="modal-title" id="modal-title">CATEGORY TITLE</div>
                <button class="close-btn" onclick="closeModal()">✕</button>
            </div>
            <div class="modal-body" id="modal-body">
                <!-- 动态填充内容 -->
            </div>
        </div>
    </div>

    <script>
        // --- 分类与行星配置 (自定义每个行星的颜色与外观) ---
        const categories = [
            { id: 'game', name: 'Game Design', color: '#00f3ff', glow: 'rgba(0, 243, 255, 0.5)', size: 38, grad: 'linear-gradient(135deg, #00f3ff, #0055ff)' },
            { id: 'installation', name: 'Interactive Installation', color: '#ff007f', glow: 'rgba(ff, 0, 127, 0.5)', size: 44, grad: 'linear-gradient(135deg, #ff007f, #7900ff)' },
            { id: 'web', name: 'Web-based Interaction', color: '#00ff9d', glow: 'rgba(0, 255, 157, 0.5)', size: 36, grad: 'linear-gradient(135deg, #00ff9d, #0088ff)' },
            { id: 'photo', name: 'Photography', color: '#ffb700', glow: 'rgba(255, 183, 0, 0.5)', size: 34, grad: 'linear-gradient(135deg, #ffb700, #ff5500)' },
            { id: 'anim', name: 'Animation', color: '#ff758c', glow: 'rgba(255, 117, 140, 0.5)', size: 40, grad: 'linear-gradient(135deg, #ff758c, #ff7eb3)' },
            { id: 'uiux', name: 'UI / UX Design', color: '#a855f7', glow: 'rgba(168, 85, 247, 0.5)', size: 38, grad: 'linear-gradient(135deg, #a855f7, #3b82f6)' },
            { id: 'art', name: 'Fine Art', color: '#ef4444', glow: 'rgba(239, 68, 68, 0.5)', size: 32, grad: 'linear-gradient(135deg, #ef4444, #b91c1c)' },
            { id: 'aifilm', name: 'AI Film', color: '#c084fc', glow: 'rgba(192, 132, 252, 0.5)', size: 42, grad: 'linear-gradient(135deg, #c084fc, #6366f1)' }
        ];

        // --- 示例项目数据 (你后续可以在这里补充具体的项目内容) ---
        const projectData = {
            game: [
                { title: 'Project CyberOrbit', desc: 'A sci-fi puzzle adventure exploring gravity mechanics in a dying star system.', img: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=600&q=80' },
                { title: 'Echoes of Time', desc: 'Narrative-driven indie game focusing on memory reconstruction.', img: 'https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=600&q=80' }
            ],
            installation: [
                { title: 'Luminous Whispers', desc: 'Interactive light installation responding to ambient bio-signals.', img: 'https://images.unsplash.com/photo-1509198397868-475647b2a1e5?auto=format&fit=crop&w=600&q=80' }
            ],
            web: [
                { title: 'Starlight Canvas', desc: 'WebGPU powered generative art tool for real-time astronomical visualization.', img: 'https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?auto=format&fit=crop&w=600&q=80' }
            ],
            photo: [
                { title: 'Nebula Fragments', desc: 'Astrophotography and long-exposure light painting series.', img: 'https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=600&q=80' }
            ]
        };

        // --- 1. 生成螺旋行星 ---
        const galaxy = document.getElementById('galaxy');
        
        function layoutPlanets() {
            const planetNodes = document.querySelectorAll('.planet-node');
            planetNodes.forEach(n => n.remove());

            const isMobile = window.innerWidth < 768;
            const startRadius = isMobile ? 80 : 130;
            const radiusStep = isMobile ? 25 : 42;
            const angleStep = 0.75; // 螺旋角度增量

            categories.forEach((cat, index) => {
                const angle = index * angleStep + 0.3;
                const radius = startRadius + index * radiusStep;

                // 对数螺旋坐标公式
                const x = Math.cos(angle) * radius;
                const y = Math.sin(angle) * radius;

                const node = document.createElement('div');
                node.className = 'planet-node';
                node.style.setProperty('--planet-color', cat.color);
                node.style.transform = `translate(${x}px, ${y}px)`;

                node.innerHTML = `
                    <div class="planet-sphere" style="
                        width: ${cat.size}px; 
                        height: ${cat.size}px; 
                        background: ${cat.grad}; 
                        box-shadow: 0 0 20px ${cat.glow};">
                    </div>
                    <div class="planet-label">${cat.name}</div>
                `;

                node.onclick = () => openCategoryModal(cat);
                galaxy.appendChild(node);
            });
        }

        layoutPlanets();
        window.addEventListener('resize', layoutPlanets);

        // --- 2. 弹窗控制与动态颜色渲染 ---
        const modalOverlay = document.getElementById('modal-overlay');
        const modalCard = document.getElementById('modal-card');
        const modalTitle = document.getElementById('modal-title');
        const modalBody = document.getElementById('modal-body');

        function openCategoryModal(cat) {
            playAudioBeep();
            modalCard.style.setProperty('--theme-color', cat.color);
            modalCard.style.setProperty('--theme-glow', cat.glow);
            modalTitle.innerText = cat.name;

            const items = projectData[cat.id] || [
                { title: `${cat.name} Project 01`, desc: 'Project documentation, media assets, and interactive demos coming soon.', img: 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=600&q=80' },
                { title: `${cat.name} Project 02`, desc: 'Concept exploration and design methodology details.', img: 'https://images.unsplash.com/photo-1461360370896-922624d12aa1?auto=format&fit=crop&w=600&q=80' }
            ];

            modalBody.innerHTML = items.map(p => `
                <div class="project-card">
                    <div class="project-thumb" style="background-image: url('${p.img}')"></div>
                    <div class="project-info">
                        <div class="project-title">${p.title}</div>
                        <div class="project-desc">${p.desc}</div>
                    </div>
                </div>
            `).join('');

            modalOverlay.classList.add('active');
        }

        function openAboutModal() {
            playAudioBeep();
            modalCard.style.setProperty('--theme-color', '#00f3ff');
            modalCard.style.setProperty('--theme-glow', 'rgba(0, 243, 255, 0.4)');
            modalTitle.innerText = "KELLY YANG";

            modalBody.innerHTML = `
                <div class="about-content">
                    <p>Hello! I am <span class="about-highlight">Kelly Yang</span>, an interactive creator working at the intersection of game design, creative technology, and visual arts.</p>
                    <p>Driven by curiosity about astronomy and human perception, my work explores interactive storytelling, futuristic UI/UX, and generative cosmic media.</p>
                    <div style="margin-top: 20px; padding: 20px; background: rgba(255,255,255,0.03); border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);">
                        <div style="font-weight: 600; margin-bottom: 10px; color: #00f3ff;">CONNECT</div>
                        <div>Email: contact@kellyyang.art</div>
                        <div>GitHub: github.com/kellyouo93z</div>
                    </div>
                </div>
            `;

            modalOverlay.classList.add('active');
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
        }

        modalOverlay.onclick = (e) => {
            if(e.target === modalOverlay) closeModal();
        };

        // --- 3. HTML5 Canvas 动态星空与星云尘埃动画 ---
        const canvas = document.getElementById('space-canvas');
        const ctx = canvas.getContext('2d');
        let stars = [];

        function initCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            stars = [];
            for (let i = 0; i < 220; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 1.8,
                    alpha: Math.random(),
                    speed: Math.random() * 0.008 + 0.002
                });
            }
        }

        function drawCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 绘制星空闪烁
            stars.forEach(s => {
                s.alpha += s.speed;
                if (s.alpha > 1 || s.alpha < 0) s.speed = -s.speed;
                ctx.fillStyle = `rgba(255, 255, 255, ${Math.abs(s.alpha)})`;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fill();
            });

            requestAnimationFrame(drawCanvas);
        }

        initCanvas();
        drawCanvas();
        window.addEventListener('resize', initCanvas);

        // --- 4. Web Audio 科幻音效 (提升探索沉浸感) ---
        let audioEnabled = true;
        const soundBtn = document.getElementById('sound-btn');
        soundBtn.onclick = () => {
            audioEnabled = !audioEnabled;
            soundBtn.innerText = audioEnabled ? '🔊 AUDIO: ON' : '🔇 AUDIO: OFF';
        };

        function playAudioBeep() {
            if (!audioEnabled) return;
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // D5 Note
                osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } catch (e) {}
        }
    </script>
</body>
</html>
